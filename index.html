<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة النتائج الطلاب</title>

    <!-- ربط Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ربط ملف CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">نظام إدارة نتائج الطلاب</h1>

        <!-- بيانات الطالب -->
        <div class="card p-4 shadow">

            <h3 class="mb-3">إضافة طالب </h3>

            <div class="mb-3">
                <label class="form-label">اسم الطالب</label>
                <input type="text" id="studentName" class="form-control" placeholder="أدخل اسم الطالب">
            </div>

            <div class="mb-3">
                <label class="form-label">درجة المادة الأولى</label>
                <input type="number" id="subject1" class="form-control" placeholder="أدخل الدرجة">
            </div>

            <div class="mb-3">
                <label class="form-label">درجة المادة الثانية</label>
                <input type="number" id="subject2" class="form-control" placeholder="أدخل الدرجة">
            </div>

            <div class="mb-3">
                <label class="form-label">درجة المادة الثالثة</label>
                <input type="number" id="subject3" class="form-control" placeholder="أدخل الدرجة">
            </div>

            <div class="mb-3">
                <label class="form-label">نسبة الحضور</label>
                <input type="number" id="attendance" class="form-control" placeholder="أدخل نسبة الحضور">
            </div>

            <div id="errorMessage" class="text-danger mb-3"></div>

            <button id="addStudentBtn" class="btn btn-primary">
                إضافة طالب
            </button>

            <button id="mercyBtn" class="btn btn-success mt-2">
                تفعيل لجنة الرأفة
            </button>

        </div>

        <!-- عرض الطلاب -->
        <div class="mt-4">
            <h3>قائمة الطلاب</h3>
            <div id="studentsDisplay"></div>
        </div>

        <!-- تقرير لجنة الرأفة -->
        <div class="mt-4 mb-5">
            <h3>تقرير لجنة الرأفة</h3>
            <div id="finalReport"></div>
        </div>

    </div>

    <!-- ربط ملف JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
